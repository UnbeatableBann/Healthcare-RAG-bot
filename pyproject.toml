[project]
name = "healthcare-ai-assistant"
version = "0.1.0"
description = "Production-oriented agentic hybrid RAG platform for healthcare knowledge management."
readme = { text = "Production-oriented agentic hybrid RAG platform for healthcare knowledge management.", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.2",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.3.0",
    "ragas>=0.2.0,<0.3.0",
    "datasets>=2.20.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
healthcare-ai-api = "apps.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "apps",
    "common",
    "core",
    "embeddings",
    "evaluation",
    "experiments",
    "llm",
    "rag",
    "rerankers",
    "schemas",
    "vectorstores",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services such as Qdrant or Ollama",
    "e2e: end-to-end API and pipeline tests",
]
